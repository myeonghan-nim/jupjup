name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      # conventional commit(fix: → patch, feat: → minor, "feat!:"처럼 "!" 표기 → major)일
      # 때만 태그가 생기고, 태그가 없으면 아래 빌드/릴리스 단계는 전부 건너뛴다
      # (docs/chore 푸시는 릴리스 미발생). v7부터 기본 파서가 conventionalcommits라
      # "!" 표기를 인식한다 — BREAKING CHANGE 푸터는 더 이상 필요 없다.
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
      - name: Build
        if: steps.tag.outputs.new_tag != ''
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-H windowsgui -s -w -extldflags=-Wl,--subsystem,windows -X main.version=${{ steps.tag.outputs.new_version }}" -o jupjup.exe .
      - name: Checksum
        if: steps.tag.outputs.new_tag != ''
        shell: pwsh
        run: '"{0}  jupjup.exe" -f (Get-FileHash jupjup.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii SHA256SUMS.txt'
      - name: Create release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: |
            jupjup.exe
            SHA256SUMS.txt
